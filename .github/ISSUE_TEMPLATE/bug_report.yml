name: Bug Report
description: Report a bug or unexpected behavior in Nova
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Write code with ...
        2. Run command ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: environment_info
    attributes:
      label: Environment Information
      description: Operating system, Nova SDK version, and any other relevant details.
      placeholder: e.g., Windows 11, Nova SDK v0.4.2
    validations:
      required: true
